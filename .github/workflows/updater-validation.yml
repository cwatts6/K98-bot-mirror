name: Updater validation

on:
  pull_request:
    paths:
      - 'deploy/k98-release.json'
      - 'services/export_coordination_dal.py'
      - 'services/export_coordination_service.py'
      - 'services/export_runtime_composition.py'
      - 'scripts/*K98*.ps1'
      - 'scripts/*k98*.py'
      - 'scripts/verify_k98_update_pair.py'
      - 'tests/test*release*.py'
      - 'tests/test*update*.py'
      - 'tests/fixtures/updater_installed_20261009.json'
      - '.github/workflows/updater-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-updater:
    runs-on: windows-latest
    env:
      PYTHON_DOTENV_DISABLED: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate committed combined release metadata
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ($env:RELEASE_BASE_SHA) {
            python scripts/validate_k98_release_description.py --base-revision $env:RELEASE_BASE_SHA
          } else {
            python scripts/validate_k98_release_description.py
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify packet and protocol compatibility
        run: python scripts/analyse_pytest_log_noise.py --pytest-args -q tests/test_prepare_k98_update.py tests/test_prepare_k98_release.py tests/test_combined_k98_update.py tests/test_release_amendment.py tests/test_export_release_seed.py tests/test_update_application_compatibility.py
      - name: Report candidate update compatibility
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m scripts.validate_k98_update_compatibility --base $env:RELEASE_BASE_SHA --head $env:GITHUB_SHA
          $compatibilityExit = $LASTEXITCODE
          if ($compatibilityExit -eq 3) {
            Write-Warning 'Coordinated release required. This source report does not authorize deployment.'
          } elseif ($compatibilityExit -ne 0) {
            exit $compatibilityExit
          }
          # PR base is not installed-host evidence. Report routing here; live admission stays fail-closed.
          exit 0
      - name: Verify Windows 5.1 orchestration and recovery
        shell: powershell
        run: |
          foreach ($script in @('Test-K98ReleaseOrchestration.ps1','Test-K98Update.ps1','Test-K98CombinedUpdate.ps1','Test-K98UpdateCloseout.ps1','Test-K98UpdateRecovery.ps1','Test-K98InstalledUpdaterUpgrade.ps1','Test-K98UpdateSource.ps1')) {
            & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path scripts $script)
            if ($LASTEXITCODE -ne 0) { throw "Updater check failed: $script" }
          }
